<!DOCTYPE html>
<html>
<head><title>ClickHouse Upload</title></head>
<body>
<h2>Upload CSV to ClickHouse</h2>
<form id="upload-form">
  Table name: <input type="text" name="table" required><br>
  CSV File: <input type="file" name="file" required><br>
  <button type="submit">Upload</button>
</form>
<pre id="result"></pre>
<script>
document.getElementById('upload-form').onsubmit = async (e) => {
  e.preventDefault();
  const formData = new FormData(e.target);
  const res = await fetch('http://localhost:8000/upload_csv/', {
    method: 'POST',
    body: formData
  });
  const json = await res.json();
  document.getElementById('result').innerText = JSON.stringify(json, null, 2);
};
</script>
</body>
</html>
